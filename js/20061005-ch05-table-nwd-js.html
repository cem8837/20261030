<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>ch5.練習表格</title>
    <link rel="stylesheet" href="myall.css">
    <link rel="stylesheet" href="bootstrap.min.css">
    <style>
        @media screen and (max-width:768px) {
            .table-rwd thead {
                display: none;
            }

            .table-rwd tbody tr {
                display: block;
                border: 3px solid var(--border003);
                margin-top: 15px;
                border-radius: 10px;
            }

            .table-rwd tbody tr td {
                display: block;
                overflow: hidden;
            }

            .table-rwd tbody tr td::before {
                /* 確保這裡抓取的是 data-th */
                content: attr(data-th) "：" ;
                font-weight: bold;
                font-size: 18px;
                color: var(--border003);
                width: 30%;
                float: left;
                text-align: right;
                padding-right: 15px;
            }

            /* 【修正重點】修正 CSS 選擇器，讓 span.table-col 順利生效 */
            .table-rwd tbody tr td span.table-col {
                width: 70%;
                float: left;
            }
        }
    </style>
</head>
